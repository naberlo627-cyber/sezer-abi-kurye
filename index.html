<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F7F7">
<title>Sezar Abi Kurye</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F1F7F7;
  --card:#FFFFFF;
  --ink:#101830;
  --ink2:#5A6675;
  --ink3:#8A94A3;
  --brand:#141F31;
  --brand2:#1E2C44;
  --green:#184824;
  --green2:#309048;
  --greenbg:#E6F2E8;
  --line:#E3EBEA;
  --danger:#B3261E;
  --r:16px;
  --shadow:0 1px 2px rgba(16,24,48,.05), 0 6px 18px rgba(16,24,48,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:22px;height:22px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- iskelet ---------- */
#app{display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}
@supports (height:100dvh){#app{height:100dvh}}
#top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px 16px}
#view::-webkit-scrollbar{display:none}

/* ---------- üst çubuk ---------- */
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brandline{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:30px;height:30px;flex:none;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:19px;font-weight:750;margin:0;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagline{font-size:12px;color:var(--ink2);margin:3px 0 0;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;flex:none}
.pill.on{background:var(--greenbg);color:var(--green)}
.pill.off{background:#EDEFF2;color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.on .dot{box-shadow:0 0 0 3px rgba(48,144,72,.18)}

/* ---------- bölüm başlığı ---------- */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 9px}
.seclabel{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.seclink{font-size:12.5px;font-weight:600;color:var(--green)}

/* ---------- kartlar ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:12px}

/* harita */
.mapwrap{position:relative;height:196px;background:#E8EFEE}
.mapwrap svg{width:100%;height:100%;display:block}
.mapoverlay{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(to top,rgba(255,255,255,.97) 42%,rgba(255,255,255,0))}
.mapname{font-size:15.5px;font-weight:750;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maplink{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--green);flex:none;padding:6px 10px;border-radius:999px;background:var(--greenbg)}
.maplink .ic{width:14px;height:14px}

/* detay */
.det{padding:15px 16px 4px}
.det h2{font-size:16.5px;font-weight:750;margin:0 0 11px;letter-spacing:-.25px}
.row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rowic{width:32px;height:32px;border-radius:10px;background:#F2F6F6;display:grid;place-items:center;flex:none;color:var(--brand)}
.rowic .ic{width:16px;height:16px}
.rowbody{min-width:0;flex:1;padding-top:1px}
.rowk{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.rowv{font-size:14px;font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.rowv small{font-weight:500;color:var(--ink2)}
.eta{display:inline-flex;align-items:center;gap:6px;background:var(--greenbg);color:var(--green);font-weight:750;font-size:13px;padding:4px 10px;border-radius:999px;margin-top:3px}

/* satır içi küçük işlem düğmeleri */
.rowbtn{width:34px;height:34px;border-radius:10px;background:#F0F4F4;display:grid;place-items:center;flex:none;
  color:var(--brand);box-shadow:inset 0 0 0 1px var(--line);transition:transform .08s}
.rowbtn:active{transform:scale(.92)}
.rowbtn .ic{width:16px;height:16px}

/* hızlı işlem şeridi */
.quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:12px;
  background:#F4F8F7;color:var(--ink2);transition:transform .08s,background .15s}
.qbtn:active{transform:scale(.95);background:#E8F0EE}
.qbtn .ic{width:19px;height:19px;color:var(--brand)}
.qbtn span{font-size:10.5px;font-weight:700;letter-spacing:.1px;text-align:center;line-height:1.2}

/* ağ durumu şeridi */
.agserit{display:none;flex:none;text-align:center;font-size:12px;font-weight:700;padding:6px 14px;
  background:#FDF1D8;color:#7A5A12}
.agserit.on{display:block}

/* sohbet */
.sohbet{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:12px 0 6px}
@supports (height:46dvh){.sohbet{max-height:46dvh}}
.balon{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;font-weight:550;line-height:1.4;
  position:relative;overflow-wrap:anywhere}
.balon.onlar{background:#F1F5F4;color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.balon.ben{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bsaat{display:block;font-size:10px;font-weight:600;opacity:.55;margin-top:4px;text-align:right}
.yazalim{display:flex;align-items:center;gap:9px;padding:8px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.yazalim input{flex:1;height:44px;border-radius:22px;border:0;background:#F1F5F4;padding:0 16px;
  font:inherit;font-size:14px;color:var(--ink);min-width:0}
.yazalim input:focus{outline:2px solid var(--green2);outline-offset:-2px}
.gonder{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.gonder .ic{width:18px;height:18px;transform:rotate(45deg)}

/* butonlar */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:13px;font-size:14.5px;font-weight:700;letter-spacing:-.1px;
  transition:transform .08s ease,opacity .15s}
.btn:active{transform:scale(.975)}
.btn .ic{width:17px;height:17px}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:#F0F4F4;color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)}
.btn.done{background:var(--green);color:#fff}
.btn[disabled]{opacity:.45}

/* bekleyen siparişler */
.orders{display:flex;flex-direction:column;gap:9px}
.order{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:13px 14px;text-align:left;width:100%;
  transition:transform .08s}
.order:active{transform:scale(.985)}
.oav{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;color:#fff;background:var(--brand2)}
.obody{flex:1;min-width:0}
.oname{font-size:14.5px;font-weight:700;letter-spacing:-.15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ometa{font-size:12.5px;color:var(--ink2);margin-top:1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ometa b{color:var(--green);font-weight:750}
.chev{color:var(--ink3);flex:none}
.chev .ic{width:18px;height:18px}

/* durum şeridi */
.statusbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 18px;font-size:12.5px;font-weight:650;color:var(--ink2);background:var(--bg)}
.sleft{display:flex;align-items:center;gap:7px}
.sleft .dot{width:8px;height:8px;background:var(--green2)}
.sleft.off .dot{background:#B6BEC9}
.sright{color:var(--ink3);font-weight:600}

/* alt menü */
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:7px 6px calc(env(safe-area-inset-bottom,0px) + 7px)}
.navb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:11px;color:var(--ink3);transition:color .15s}
.navb .ic{width:21px;height:21px}
.navb span{font-size:10px;font-weight:650;letter-spacing:.1px}
.navb.on{color:var(--brand)}
.navb.on .ic{stroke-width:2.2}

/* ---------- ikincil ekranlar ---------- */
.phead{margin:14px 0 4px}
.phead h2{font-size:23px;font-weight:780;margin:0;letter-spacing:-.5px}
.phead p{margin:4px 0 0;font-size:13px;color:var(--ink2)}

.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.statk{font-size:11px;font-weight:750;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3)}
.statv{font-size:22px;font-weight:780;margin-top:4px;letter-spacing:-.6px}
.statv small{font-size:13px;font-weight:650;color:var(--ink2);letter-spacing:0}
.delta{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--green2)}.down{color:var(--danger)}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:16px;padding:0 2px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.bar{width:100%;border-radius:7px 7px 4px 4px;background:#DDE7E4;min-height:5px;transition:height .4s cubic-bezier(.3,1.2,.5,1)}
.bar.top{background:var(--brand)}
.barlab{font-size:10.5px;color:var(--ink3);font-weight:650}
.barval{font-size:10.5px;font-weight:750;color:var(--ink2)}

.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:13px 14px;width:100%;text-align:left}
.liav{width:40px;height:40px;border-radius:50%;background:#EEF3F3;display:grid;place-items:center;flex:none;font-weight:750;color:var(--brand);font-size:14px}
.lib{flex:1;min-width:0}
.lit{font-size:14.5px;font-weight:700;letter-spacing:-.15px}
.lis{font-size:12.5px;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litime{font-size:11.5px;color:var(--ink3);font-weight:650;flex:none;align-self:flex-start;margin-top:3px}
.unread{width:8px;height:8px;border-radius:50%;background:var(--green2);flex:none}

.kv{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.kvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-top:1px solid var(--line);width:100%;text-align:left}
.kvrow:first-child{border-top:0}
.kvk{font-size:14px;font-weight:600;display:flex;align-items:center;gap:11px}
.kvk .ic{width:18px;height:18px;color:var(--ink2)}
.kvv{font-size:13.5px;color:var(--ink2);font-weight:600;text-align:right}
.kvrow .chev .ic{width:16px;height:16px}

.hero{background:var(--brand);color:#fff;border-radius:16px;padding:18px;margin-top:14px;display:flex;align-items:center;gap:14px}
.heroav{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;font-weight:780;flex:none}
.herobody{min-width:0;flex:1}
.heron{font-size:17px;font-weight:750;letter-spacing:-.3px}
.herom{font-size:12.5px;opacity:.72;margin-top:2px}
.herostat{display:flex;gap:14px;margin-top:9px}
.herostat div{font-size:11px;opacity:.72;font-weight:650}
.herostat b{display:block;font-size:14px;opacity:1;font-weight:780;margin-top:1px}

.faq{background:var(--card);border-radius:13px;box-shadow:var(--shadow);margin-top:9px;overflow:hidden}
.faqq{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;width:100%;text-align:left;font-size:14px;font-weight:680}
.faqq .ic{width:16px;height:16px;color:var(--ink3);transition:transform .2s}
.faq.open .faqq .ic{transform:rotate(180deg)}
.faqa{display:none;padding:0 15px 14px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.faq.open .faqa{display:block}

/* ---------- katman (sheet) ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(16,24,48,.42);opacity:0;transition:opacity .22s}
#sheet.in .scrim{opacity:1}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,1.1,.4,1);max-height:88vh;overflow-y:auto}
@supports (height:88dvh){#sheet .panel{max-height:88dvh}}
#sheet.in .panel{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:#DDE4E4;margin:6px auto 14px}
.shhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.shhead h3{font-size:19px;font-weight:780;margin:0;letter-spacing:-.4px}
.shclose{width:32px;height:32px;border-radius:50%;background:#F0F4F4;display:grid;place-items:center;flex:none;color:var(--ink2)}
.shclose .ic{width:16px;height:16px}
.shsub{font-size:13px;color:var(--ink2);margin:2px 0 0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,14px);
  background:var(--brand);color:#fff;font-size:13.5px;font-weight:650;padding:11px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:34px 20px;color:var(--ink3);font-size:13.5px}
.empty .ic{width:38px;height:38px;margin:0 auto 10px;color:#C6D0D0}
</style>
</head>

function yukle(){
  try{

    if(!ham) return JSON.parse(JSON.stringify(VARSAYILAN));
    var d=JSON.parse(ham);
    var birles=Object.assign(JSON.parse(JSON.stringify(VARSAYILAN)),d);
    gocEttir(birles);
    return birles;
  }catch(e){ return JSON.parse(JSON.stringify(VARSAYILAN)); }
}
/* Eski kayıtlarda koordinat ve telefon yoktu; v1.0 kullanıcıları
   navigasyon/paylaşım özelliklerini kaybetmesin diye eşleşen
   siparişten tamamlanır. */
function gocEttir(s){
  function tamamla(g, kaynak){
    if(!g) return;
    ['alis','varis','tel','musteriTel'].forEach(function(k){
      if(g[k]==null && kaynak && kaynak[k]!=null) g[k]=kaynak[k];
    });
  }
  if(s.aktifGorev){
    var esle=VARSAYILAN.siparisler.filter(function(x){
      return x.isletme===s.aktifGorev.isletme; })[0];
    if(!esle && VARSAYILAN.aktifGorev.isletme===s.aktifGorev.isletme) esle=VARSAYILAN.aktifGorev;
    tamamla(s.aktifGorev, esle);
  }
  (s.siparisler||[]).forEach(function(o){
    var esle=VARSAYILAN.siparisler.filter(function(x){ return x.id===o.id; })[0];
    tamamla(o, esle);
  });
}

/* ============ gerçek cihaz işlevleri ============ */

/* Titreşim: dokunma geri bildirimi. Desteklenmiyorsa sessizce geçer. */
function titres(desen){ try{ if(navigator.vibrate) navigator.vibrate(desen||12); }catch(e){} }

/* Uygulama APK içinde mi çalışıyor? Android köprüsü bunu işaretler. */
function apkMi(){ return !!(window.SEZAR_APP_MODE && window.SEZAR_APP); }

/* Dış adresi aç: APK'da native köprü, tarayıcıda yeni sekme.
   window.open popup engeline takılabildiği için gerçek bağlantı öğesi
   kullanılır; bu yol kullanıcı dokunuşuyla her zaman çalışır. */
function disariAc(url){
  if(apkMi()){ try{ window.SEZAR_APP.open(url); return; }catch(e){} }
  var a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); },0);
}

/* Google Maps navigasyonu — gerçek yol tarifi. */
function navigasyonBaslat(hedef, ad){
  if(!hedef || hedef.length<2){ toast('Adres koordinatı yok'); return; }
  var lat=hedef[0], lng=hedef[1];
  var url='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+
          '&travelmode=driving&dir_action=navigate';
  titres([14,40,14]);
  disariAc(url);
  toast('Navigasyon açılıyor: '+(ad||'varış'));
}

/* Haritada göster (yol tarifi değil, sadece konum). */
function haritadaGoster(konum, ad){
  if(!konum || konum.length<2){ toast('Koordinat yok'); return; }
  var url='https://www.google.com/maps/search/?api=1&query='+konum[0]+','+konum[1];
  titres(12); disariAc(url);
}

/* Telefon: gerçek arama ekranı. */
function ara(tel){
  if(!tel){ toast('Telefon numarası yok'); return; }
  var temiz=String(tel).replace(/[^\d+]/g,'');
  titres([10,30,10]);
  location.href='tel:'+temiz;
  toast('Aranıyor: '+temiz);
}

/* WhatsApp: müşteriye yaz. */
function whatsapp(tel, metin){
  if(!tel){ toast('Numara yok'); return; }
  var temiz=String(tel).replace(/[^\d]/g,'');
  var url='https://wa.me/'+temiz+(metin?'?text='+encodeURIComponent(metin):'');
  titres(12); disariAc(url);
}

/* Paylaş: native paylaşım sayfası (Android/Chrome), yoksa kopyala. */
function paylas(baslik, metin, url){
  var veri={title:baslik||'Sezar Abi Kurye', text:metin||'', url:url||location.href};
  if(navigator.share){
    navigator.share(veri).catch(function(){});
    return;
  }
  kopyala((metin?metin+'\n':'')+veri.url,'Bağlantı kopyalandı');
}

/* Panoya kopyala: eski tarayıcılar için yedek yol var. */
function kopyala(metin, mesaj){
  function tamam(){ toast(mesaj||'Kopyalandı'); titres(12); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(metin).then(tamam).catch(function(){ eskiKopyala(metin,tamam); });
  } else eskiKopyala(metin,tamam);
}
function eskiKopyala(metin,tamam){
  var t=document.createElement('textarea');
  t.value=metin; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); tamam(); }
  catch(e){ toast('Kopyalanamadı'); }
  document.body.removeChild(t);
}

  disariAc(url);
  toast('İndirme başladı');

/* ---------- aşağı çekip yenile ---------- */
function yenileKur(){
  var v=$('#view'), bas=0, cekik=false, esik=64;
  v.addEventListener('touchstart',function(e){
    if(v.scrollTop<=0){ bas=e.touches[0].clientY; cekik=true; }
  },{passive:true});
  v.addEventListener('touchmove',function(e){
    if(!cekik) return;
    var d=e.touches[0].clientY-bas;
    if(d>0 && v.scrollTop<=0) v.style.transform='translateY('+Math.min(d*0.45,esik)+'px)';
  },{passive:true});
  v.addEventListener('touchend',function(e){
    if(!cekik) return;
    cekik=false;
    var d=(e.changedTouches[0].clientY-bas)*0.45;
    v.style.transform='';
    if(d>=esik){
      titres(14); toast('Yenileniyor…');
      setTimeout(function(){ gorunumCiz(); durumCiz(); toast('Güncel'); },420);
    }
  },{passive:true});
}

/* ============ görünüm yönlendirme ============ */
function gorunumCiz(){
  var v=$('#view');
  var html='';
  if(S.sekme==='home') html=anaSayfa();
  else if(S.sekme==='kazanc') html=kazancSayfasi();

/* ============ olay bağlama ============ */
function bagla(kok){
  Array.prototype.forEach.call(kok.querySelectorAll('[data-siparis]'),function(b){
    b.addEventListener('click',function(){ siparisKatman(b.dataset.siparis); });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-faqbtn]'),function(b){
    b.addEventListener('click',function(){
      var f=b.closest('.faq'); f.classList.toggle('open');
    });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-mesaj]'),function(b){
    b.addEventListener('click',function(){
      var m=S.mesajlar.filter(function(x){return x.id===b.dataset.mesaj;})[0];
      if(m){ m.okunmadi=false; kaydet(); sohbetKatmani(m.id); gorunumCiz(); }
    });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-act]'),function(b){
    b.addEventListener('click',function(){ eylem(b.dataset.act, b); });
  });
}
function eylem(ad, el){
  var a=S.aktifGorev;
  if(ad==='asama'){
    if(!a) return;
    titres([12,30,12]);
    if(a.asama==='paket'){ a.asama='yolda'; toast('Paket alındı — müşteriye gidiyorsun');
      bildir('Paket alındı', a.isletme+' · '+a.adres); }
    else if(a.asama==='yolda'){ a.asama='teslim';
      S.kazanc.bugun+=a.ucret; S.kazanc.hafta+=a.ucret; S.kazanc.ay+=a.ucret; S.teslimat+=1;
      toast('Teslimat tamamlandı · +'+para(a.ucret));
      bildir('Teslimat tamam', a.musteri+' · +'+para(a.ucret)); }
    else { S.aktifGorev=null; toast('Görev tamamlandı, teşekkürler!'); }
    kaydet(); gorunumCiz(); durumCiz();
  }
  else if(ad==='navigasyon'){
    if(!a) return;
    var hedef=a.asama==='paket'? a.alis : a.varis;
    navigasyonBaslat(hedef, a.asama==='paket'? a.isletme : a.musteri);
  }
  else if(ad==='harita'){
    if(!a) return;
    haritadaGoster(a.asama==='paket'? a.alis : a.varis, a.isletme);
  }
  else if(ad==='kopyalaAdres'){
    if(!a) return;
    kopyala(a.adres, 'Adres kopyalandı');
  }
  else if(ad==='musteriAra'){
    if(!a) return; ara(a.musteriTel);
  }
  else if(ad==='musteriYaz'){
    if(!a) return;
    whatsapp(a.musteriTel, 'Merhaba '+a.musteri+', Sezar Abi Kurye\'den geliyorum. Yoldayım.');
  }
  else if(ad==='gorevAra'){
    if(!a) return; ara(a.tel);
  }
  else if(ad==='paylasGorev'){
    if(!a) return;
    paylas('Sezar Abi Kurye · Görev', siparisMetni(a));
  }
  else if(ad==='bildir'){
    if(!a) return;
    if(bildirimIzni()!=='granted'){ bildirimIste(); return; }
    bildir('Görev hatırlatması', a.isletme+' · '+a.sure+' dakika kaldı');
    toast('Hatırlatma gönderildi');
  }
  else if(ad==='guncelle'){ guncelle(el && el.dataset ? el.dataset.url : null); }
  else if(ad==='kopyalaSiparis'){
    var ks=siparisBul(el); if(!ks) return; kopyala(ks.adres,'Adres kopyalandı');
  }
  else if(ad==='siparisHarita'){
    var kh=siparisBul(el); if(!kh) return; haritadaGoster(kh.alis, kh.isletme);
  }
  else if(ad==='isletmeAra'){
    var ki=siparisBul(el); if(!ki) return; ara(ki.tel);
  }
  else if(ad==='paylasSiparis'){
    var kp=siparisBul(el); if(!kp) return;
    paylas('Sezar Abi Kurye · Sipariş', siparisMetni(kp));
  }
  else if(ad==='bitir'){
    S.aktifGorev=null; kaydet(); toast('Görev bırakıldı'); gorunumCiz(); durumCiz();
  }
  else if(ad==='kur'){ kur(); }
  else if(ad==='surum'){ surumDenetle(false); }
  else if(ad==='paylas'){ paylas('Sezar Abi Kurye','Kurye görev uygulaması'); }
  else if(ad==='bilgi'){ kisiselBilgiKatmani(); }
  else if(ad==='belge'){ belgeKatmani(); }
  else if(ad==='bildirim'){ bildirimIste(); }
  else if(ad==='hesap'){ odemeKatmani(); }
  else if(ad==='destek'){
    whatsapp('+905321112200','Merhaba, Sezar Abi Kurye destek.');
  }
  else if(ad==='ara'){ ara('08500000000'); }
  else if(ad==='cikis'){ cikisKatmani(); }
  else if(ad==='cikisOnay'){ cikisOnay(); }
}

/* Katman içindeki düğmenin siparişini bul. */
function siparisBul(el){
  var id=el && el.dataset ? el.dataset.id : null;
  if(!id) return null;
  return S.siparisler.filter(function(x){return x.id===id;})[0]||null;
}

/* ============ sohbet katmanı ============ */
/* Mesajlaşma demo veriyle çalışır; gönderilen metin cihazda saklanır.
   Gerçek sunucu bağlanınca yalnızca gonder() gövdesi değişir. */
function sohbetKatmani(id){
  var m=S.mesajlar.filter(function(x){return x.id===id;})[0];
  if(!m) return;
  m.gecmis=m.gecmis||[{kim:'onlar', metin:m.son, saat:m.saat}];
  katmanAc(
    '<div class="shhead"><div><h3>'+esc(m.kim)+'</h3>'+
      '<p class="shsub">Görevle ilgili mesajlar</p></div>'+
      '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
    '<div class="sohbet" id="sohbet">'+m.gecmis.map(function(x){
      return '<div class="balon '+(x.kim==='ben'?'ben':'onlar')+'">'+esc(x.metin)+
        '<span class="bsaat">'+esc(x.saat||'')+'</span></div>';
    }).join('')+'</div>'+
    '<div class="yazalim">'+
      '<input id="yazMetin" type="text" placeholder="Mesaj yaz…" autocomplete="off">'+
      '<button class="gonder" type="button" id="yazGonder" aria-label="Gönder">'+ic('nav')+'</button>'+
    '</div>'
  );
  var girdi=$('#yazMetin'), dugme=$('#yazGonder');
  function gonder(){
    var t=(girdi.value||'').trim();
    if(!t) return;
    var saat=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    m.gecmis.push({kim:'ben', metin:t, saat:saat});
    m.son=t; m.saat=saat; m.okunmadi=false;
    kaydet(); girdi.value='';
    var k=$('#sohbet');
    var b=document.createElement('div');
    b.className='balon ben';
    b.textContent=t;
    var s=document.createElement('span'); s.className='bsaat'; s.textContent=saat;
    b.appendChild(s); k.appendChild(b);
    k.scrollTop=k.scrollHeight;
    titres(10);
    /* Sunucu bağlanana kadar karşı taraf otomatik yanıtlar. */
    setTimeout(function(){
      var y='Tamamdır, teşekkürler 👍';
      m.gecmis.push({kim:'onlar', metin:y, saat:saat}); kaydet();
      var yb=document.createElement('div');
      yb.className='balon onlar'; yb.textContent=y;
      var ys=document.createElement('span'); ys.className='bsaat'; ys.textContent=saat;
      yb.appendChild(ys); k.appendChild(yb); k.scrollTop=k.scrollHeight;
      titres(8);
    },1400);
  }
  dugme.addEventListener('click',gonder);
  girdi.addEventListener('keydown',function(e){ if(e.key==='Enter') gonder(); });
  setTimeout(function(){ girdi.focus(); },260);
}

function cikisOnay(){
  katmanKapat();
  S.online=false; kaydet(); ustCiz(); durumCiz();
  toast('Çıkış yapıldı');
}

/* ============ sipariş katmanı ============ */
function katmanAc(html){
  var sh=$('#sheet');
  $('#sheetPanel').innerHTML='<div class="grab"></div>'+html;
  sh.classList.add('on');
  requestAnimationFrame(function(){ sh.classList.add('in'); });
  var kapat=$('#sheetPanel').querySelector('[data-close]');
  if(kapat) kapat.addEventListener('click',katmanKapat);
  var scrim=sh.querySelector('.scrim');
  scrim.onclick=katmanKapat;
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-al]'),function(b){
    b.addEventListener('click',function(){ gorevAl(b.dataset.al); });
  });
  /* Katman içindeki eylem düğmeleri de bağlanmalı; yoksa ölü kalır. */
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-close]:not([data-act])'),function(b){
    b.addEventListener('click',katmanKapat);
  });
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-act]'),function(b){
    b.addEventListener('click',function(){ eylem(b.dataset.act, b); });
  });
}
function katmanKapat(){
  var sh=$('#sheet');
  sh.classList.remove('in');
  setTimeout(function(){ sh.classList.remove('on'); },240);
}
function siparisKatman(id){
  var o=S.siparisler.filter(function(x){return x.id===id;})[0];
  if(!o) return;
  katmanAc(
    '<div class="shhead"><div><h3>'+esc(o.isletme)+'</h3>'+
      '<p class="shsub">'+esc(String(o.km).replace('.',','))+' km · '+esc(o.sure)+' dakika · '+para(o.ucret)+'</p></div>'+
      '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
    '<div class="det" style="padding:12px 0 0">'+
      '<div class="row"><div class="rowic">'+ic('pin')+'</div><div class="rowbody">'+
        '<div class="rowk">Alış adresi</div><div class="rowv">'+esc(o.adres)+'</div></div>'+
        '<button class="rowbtn" type="button" data-act="kopyalaSiparis" data-id="'+esc(o.id)+'" title="Adresi kopyala">'+ic('doc')+'</button></div>'+
      '<div class="row"><div class="rowic">'+ic('user')+'</div><div class="rowbody">'+
        '<div class="rowk">Müşteri</div><div class="rowv">'+esc(o.musteri)+'</div></div>'+
        '<button class="rowbtn" type="button" data-act="siparisHarita" data-id="'+esc(o.id)+'" title="Haritada gör">'+ic('map')+'</button></div>'+
      '<div class="row"><div class="rowic">'+ic('clock')+'</div><div class="rowbody">'+
        '<div class="rowk">Tahmini süre</div><div class="rowv"><span class="eta">'+ic('clock')+esc(o.sure)+' dakika</span></div></div></div>'+
    '</div>'+
    '<div class="acts" style="padding:16px 0 8px;grid-template-columns:1fr">'+
      '<button class="btn pri" type="button" data-al="'+esc(o.id)+'">'+ic('box')+'Görevi Al</button>'+
    '</div>'+
    '<div class="quickrow" style="padding:0 0 4px">'+
      '<button class="qbtn" type="button" data-act="paylasSiparis" data-id="'+esc(o.id)+'">'+ic('share')+'<span>Paylaş</span></button>'+
      '<button class="qbtn" type="button" data-act="isletmeAra" data-id="'+esc(o.id)+'">'+ic('phone')+'<span>İşletme</span></button>'+
      '<button class="qbtn" type="button" data-act="siparisHarita" data-id="'+esc(o.id)+'">'+ic('map')+'<span>Harita</span></button>'+
      '<button class="qbtn" type="button" data-close>'+ic('close')+'<span>Kapat</span></button>'+
    '</div>'
  );
}
function gorevAl(id){
  var o=S.siparisler.filter(function(x){return x.id===id;})[0];
  if(!o) return;
  S.siparisler=S.siparisler.filter(function(x){return x.id!==id;});
  /* Sipariş nesnesi olduğu gibi kopyalanır: alan alan kurmak yeni
     eklenen alanları (koordinat, telefon) düşürüyordu. */
  S.aktifGorev=JSON.parse(JSON.stringify(o));
  S.aktifGorev.asama='paket';
  kaydet(); katmanKapat();
  S.sekme='home'; navCiz(); gorunumCiz(); durumCiz();
  toast('Görev alındı: '+o.isletme);
}

/* ============ başlat ============ */
/* Kısayol derin bağlantısı: ?git=<sekme> */
(function derinBaglanti(){
  var m=/[?&]git=([a-z]+)/i.exec(location.search);
  if(!m) return;
  var k=m[1].toLowerCase();
  var gecerli=SEKMELER.some(function(s){ return s.k===k; });
  if(gecerli) S.sekme=k;
})();

ustCiz(); navCiz(); gorunumCiz(); durumCiz(); agDurumu(); yenileKur();

/* Çevrimdışı destek: servis çalışanını kaydet. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  /* Yeni sürüm devreye girince bir kez yenile; yoksa kullanıcı eski
     sürümde takılı kalır. Sonsuz döngüyü bayrakla engelle. */
  var yenilendi=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(yenilendi) return;
    yenilendi=true;
    location.reload();
  });
}

/* Geri tuşu / Android geri: katman açıksa kapat. */
window.addEventListener('keydown',function(e){
  if(e.key==='Escape') katmanKapat();
});
history.pushState({katman:false},'');
window.addEventListener('popstate',function(){
  var sh=$('#sheet');
  if(sh && sh.classList.contains('on')){
    katmanKapat();
    history.pushState({katman:false},'');
  }
});

/* Sürüm denetimi: açılışta sessiz, günde bir kez. */
try{
  var sonDeneme=Number(localStorage.getItem('sezar.surumDeneme')||0);
  if(Date.now()-sonDeneme > 86400000){
    localStorage.setItem('sezar.surumDeneme',String(Date.now()));
    setTimeout(function(){ surumDenetle(true); },2500);
  }
}catch(e){}

})();
