<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Sezar Abi Kurye</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  /* Tek renk dili: siyah–beyaz. Hiyerarşi renkle değil, ağırlık ve
     boşlukla kurulur. Eski değişken adları korunur; hepsi tek renge bağlı. */
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --sunken:#F6F6F7;
  --ink:#0A0A0B;
  --ink2:#5C5C64;
  --ink3:#63636B;
  --line:#ECECEF;
  --line2:#DCDCE0;
  --r:18px;
  --hair:1px solid var(--line);
  --ease:cubic-bezier(.22,.61,.36,1);
  /* eski adlar */
  --card:#FFFFFF;--brand:#0A0A0B;--brand2:#0A0A0B;
  --green:#0A0A0B;--green2:#0A0A0B;--greenbg:#F6F6F7;--danger:#0A0A0B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:22px;height:22px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- iskelet ---------- */
#app{display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}
@supports (height:100dvh){#app{height:100dvh}}
#top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 12px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 20px 20px}
#view::-webkit-scrollbar{display:none}

/* ---------- üst çubuk ---------- */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:32px;height:32px;flex:none;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  font-size:12.5px;font-weight:600;letter-spacing:-.1px;flex:none;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.on .dot{background:#fff}

/* ---------- bölüm başlığı ---------- */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.seclabel{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
.seclink{font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.1px}

/* ---------- kartlar ---------- */
.card{background:var(--surface);border-radius:var(--r);border:var(--hair);overflow:hidden}
.card + .card{margin-top:12px}

/* harita */
/* rota şeridi — sahte harita yerine gerçek durak akışı */
.rota{padding:18px 16px 4px;background:var(--sunken);border-bottom:var(--hair)}
.rdura{display:flex;align-items:flex-start;gap:13px;position:relative}
.rdura + .rdura{margin-top:2px}
.rray{width:14px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.rnokta{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink);background:var(--surface);flex:none;box-sizing:border-box}
.rnokta.dolu{background:var(--ink)}
.rnokta.halka{background:var(--surface)}
.rcizgi{width:2px;flex:1;min-height:22px;background:repeating-linear-gradient(to bottom,var(--line2) 0 4px,transparent 4px 8px);margin:3px 0}
.rgovde{flex:1;min-width:0;padding-bottom:14px}
.rdura:last-child .rgovde{padding-bottom:0}
.rrol{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3)}
.rad{font-size:14px;font-weight:600;letter-spacing:-.2px;margin-top:2px;overflow-wrap:anywhere;line-height:1.35}
.ralt{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:500}
.rgit{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding:11px;width:100%;
  border-radius:12px;background:var(--surface);border:1px solid var(--line2);
  font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.rgit .ic{width:14px;height:14px;stroke-width:1.8}

/* detay */
.det{padding:16px 16px 6px}
.det h2{display:none}
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:var(--hair)}
.row:first-of-type{border-top:0}
.rowic{width:34px;height:34px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;flex:none;color:var(--ink)}
.rowic .ic{width:16px;height:16px;stroke-width:1.7}
.rowbody{min-width:0;flex:1;padding-top:2px}
.rowk{font-size:11px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}
.rowv{font-size:14.5px;font-weight:550;margin-top:2px;overflow-wrap:anywhere;letter-spacing:-.1px}
.rowv small{font-weight:500;color:var(--ink2)}
.eta{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:999px;margin-top:2px}
.eta .ic{width:13px;height:13px;stroke-width:1.8}

/* satır içi küçük işlem düğmeleri */
.rowbtn{width:36px;height:36px;border-radius:11px;background:var(--surface);display:grid;place-items:center;flex:none;
  color:var(--ink);border:1px solid var(--line2);transition:transform .12s var(--ease),background .15s}
.rowbtn:active{transform:scale(.94);background:var(--sunken)}
.rowbtn .ic{width:16px;height:16px;stroke-width:1.7}

/* hızlı işlem şeridi */
.quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:13px;
  background:var(--sunken);color:var(--ink2);transition:transform .12s var(--ease),background .15s}
.qbtn:active{transform:scale(.95);background:#EFEFF1}
.qbtn .ic{width:18px;height:18px;color:var(--ink);stroke-width:1.7}
.qbtn span{font-size:11px;font-weight:600;letter-spacing:.1px;text-align:center;line-height:1.25}

/* ağ durumu şeridi */
.agserit{display:none;flex:none;text-align:center;font-size:12px;font-weight:600;padding:8px 14px;
  background:var(--ink);color:#fff;letter-spacing:-.1px}
.agserit.on{display:block}

/* sohbet */
.sohbet{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:14px 0 6px}
@supports (height:46dvh){.sohbet{max-height:46dvh}}
.balon{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13.5px;font-weight:500;line-height:1.45;
  position:relative;overflow-wrap:anywhere;letter-spacing:-.1px}
.balon.onlar{background:var(--sunken);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px}
.balon.ben{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bsaat{display:block;font-size:11px;font-weight:550;opacity:.5;margin-top:5px;text-align:right}
.yazalim{display:flex;align-items:center;gap:9px;padding:10px 0 4px;border-top:var(--hair);margin-top:8px}
.yazalim input{flex:1;height:46px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);padding:0 17px;
  font:inherit;font-size:14px;color:var(--ink);min-width:0}
.yazalim input::placeholder{color:var(--ink3)}
.yazalim input:focus{outline:2px solid var(--ink);outline-offset:-2px}
.gonder{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.gonder .ic{width:18px;height:18px;transform:rotate(45deg);stroke-width:1.8}

/* butonlar */
.ozet{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0}
.ozetU{min-width:0}
.ozetK{font-size:11px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}
.ozetV{font-size:24px;font-weight:680;letter-spacing:-1px;margin-top:3px;font-variant-numeric:tabular-nums}
.ozetS{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.cip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;
  background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;letter-spacing:-.1px}
.cip .ic{width:13px;height:13px;stroke-width:1.8;color:var(--ink2)}
.acts{display:grid;grid-template-columns:1fr;gap:10px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;
  font-size:14px;font-weight:600;letter-spacing:-.1px;transition:transform .12s var(--ease),opacity .15s}
.btn:active{transform:scale(.978)}
.btn .ic{width:17px;height:17px;stroke-width:1.8}
.btn.pri,.btn.done{background:var(--ink);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn[disabled]{opacity:.4}

/* bekleyen siparişler */
.orders{background:var(--surface);border-radius:15px;border:var(--hair);overflow:hidden}
.order{display:flex;align-items:center;gap:13px;background:var(--surface);
  padding:15px;text-align:left;width:100%;transition:background .15s}
.order + .order{border-top:var(--hair)}
.order:active{background:var(--sunken)}
.oav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  font-weight:650;font-size:15px;color:#fff;background:var(--ink);letter-spacing:-.2px}
.obody{flex:1;min-width:0}
.oname{font-size:14.5px;font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ometa{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ometa b{color:var(--ink);font-weight:650}
.chev{color:var(--ink3);flex:none}
.chev .ic{width:17px;height:17px;stroke-width:1.7}

/* durum şeridi: kaldırıldı — üst çubuktaki rozet tek gösterge */
.statusbar{display:none}
.sleft,.sright{display:none}

/* alt menü */
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px) saturate(180%);
  border-top:var(--hair);
  padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.navb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px;
  color:var(--ink3);transition:color .15s var(--ease)}
.navb .ic{width:21px;height:21px;stroke-width:1.6}
.navb span{font-size:11px;font-weight:600;letter-spacing:.1px}
.navb.on{color:var(--ink)}
.navb.on .ic{stroke-width:2}

/* ---------- ikincil ekranlar ---------- */
.phead{margin:10px 0 2px}
.phead h2{font-size:26px;font-weight:680;margin:0;letter-spacing:-.9px}
.phead p{margin:5px 0 0;font-size:13px;color:var(--ink2);letter-spacing:-.1px}

.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--surface);border-radius:15px;border:var(--hair);padding:15px}
.statk{font-size:11px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}
.statv{font-size:23px;font-weight:680;margin-top:5px;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.statv small{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:0}
.delta{font-size:12px;font-weight:600;margin-top:3px;color:var(--ink2)}
.up{color:var(--ink)}

.bars{display:flex;align-items:flex-end;gap:9px;height:124px;margin-top:18px;padding:0 2px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{width:100%;border-radius:6px 6px 3px 3px;background:#E9E9EC;min-height:4px;transition:height .45s var(--ease)}
.bar.top{background:var(--ink)}
.barlab{font-size:11px;color:var(--ink3);font-weight:600}
.barval{font-size:11px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums}

.list{background:var(--surface);border-radius:15px;border:var(--hair);overflow:hidden;margin-top:16px}
.li{display:flex;align-items:center;gap:13px;background:var(--surface);padding:15px;width:100%;text-align:left;transition:background .15s}
.li + .li{border-top:var(--hair)}
.li:active{background:var(--sunken)}
.liav{width:40px;height:40px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;flex:none;font-weight:650;color:var(--ink);font-size:14px}
.liav .ic{width:17px;height:17px;stroke-width:1.8}
.lib{flex:1;min-width:0}
.lit{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.lis{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litime{font-size:12px;color:var(--ink3);font-weight:600;flex:none;align-self:flex-start;margin-top:3px;font-variant-numeric:tabular-nums}
.unread{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}

.kv{background:var(--surface);border-radius:15px;border:var(--hair);overflow:hidden;margin-top:16px}
.kvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-top:var(--hair);width:100%;text-align:left;transition:background .15s}
.kvrow:active{background:var(--sunken)}
.kvrow:first-child{border-top:0}
.kvk{font-size:14px;font-weight:550;display:flex;align-items:center;gap:12px;letter-spacing:-.1px}
.kvk .ic{width:18px;height:18px;color:var(--ink2);stroke-width:1.7}
.kvv{font-size:13px;color:var(--ink3);font-weight:550;text-align:right}
.kvrow .chev .ic{width:16px;height:16px}

.hero{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-top:16px;display:flex;align-items:center;gap:15px}
.heroav{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:650;flex:none;letter-spacing:-.5px}
.herobody{min-width:0;flex:1}
.heron{font-size:17px;font-weight:650;letter-spacing:-.4px}
.herom{font-size:12.5px;opacity:.6;margin-top:2px}
.herostat{display:flex;gap:18px;margin-top:11px}
.herostat div{font-size:11px;opacity:.6;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.herostat b{display:block;font-size:15px;opacity:1;font-weight:680;margin-top:2px;letter-spacing:-.3px;text-transform:none}

.faqs{margin-top:16px;border:var(--hair);border-radius:15px;overflow:hidden;background:var(--surface)}
.faq{background:var(--surface);border-radius:0;border:0;border-top:var(--hair);margin-top:0;overflow:hidden}
.faq:first-of-type{border-top:0;border-radius:15px 15px 0 0}
.faq:last-of-type{border-radius:0 0 15px 15px}
.faqq{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;width:100%;text-align:left;font-size:14px;font-weight:600;letter-spacing:-.15px}
.faqq .ic{width:16px;height:16px;color:var(--ink3);transition:transform .22s var(--ease)}
.faq.open .faqq .ic{transform:rotate(180deg)}
.faqa{display:none;padding:0 16px 15px;font-size:13.5px;color:var(--ink2);line-height:1.6}
.faq.open .faqa{display:block}

/* ---------- katman (sheet) ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,10,11,.38);opacity:0;transition:opacity .24s var(--ease)}
#sheet.in .scrim{opacity:1}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateY(100%);transition:transform .3s var(--ease);max-height:88vh;overflow-y:auto;
  border-top:var(--hair)}
@supports (height:88dvh){#sheet .panel{max-height:88dvh}}
#sheet.in .panel{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:8px auto 16px}
.shhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.shhead h3{font-size:19px;font-weight:680;margin:0;letter-spacing:-.5px}
.shclose{width:32px;height:32px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;flex:none;color:var(--ink2)}
.shclose .ic{width:15px;height:15px;stroke-width:1.8}
.shsub{font-size:13px;color:var(--ink2);margin:3px 0 0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,14px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:550;padding:12px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:80;max-width:88vw;text-align:center;letter-spacing:-.1px}
#toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:38px 22px;color:var(--ink3);font-size:13px;line-height:1.6}
.empty .ic{width:34px;height:34px;margin:0 auto 12px;color:var(--line2);stroke-width:1.5}
</style>
</head>

<script>
(function(){

/* ============ durum ============ */

};

var S=yukle();
function yukle(){
  try{
    var ham=localStorage.getItem(KEY);
    if(!ham) return JSON.parse(JSON.stringify(VARSAYILAN));
    var d=JSON.parse(ham);
    var birles=Object.assign(JSON.parse(JSON.stringify(VARSAYILAN)),d);
    gocEttir(birles);
    return birles;
  }catch(e){ return JSON.parse(JSON.stringify(VARSAYILAN)); }
}
/* Eski kayıtlarda koordinat ve telefon yoktu; v1.0 kullanıcıları
   navigasyon/paylaşım özelliklerini kaybetmesin diye eşleşen
   siparişten tamamlanır. */
function gocEttir(s){
  function tamamla(g, kaynak){
    if(!g) return;
    ['alis','varis','tel','musteriTel'].forEach(function(k){
      if(g[k]==null && kaynak && kaynak[k]!=null) g[k]=kaynak[k];
    });
  }
  if(s.aktifGorev){
    var esle=VARSAYILAN.siparisler.filter(function(x){
      return x.isletme===s.aktifGorev.isletme; })[0];
    if(!esle && VARSAYILAN.aktifGorev.isletme===s.aktifGorev.isletme) esle=VARSAYILAN.aktifGorev;
    tamamla(s.aktifGorev, esle);
  }
  (s.siparisler||[]).forEach(function(o){
    var esle=VARSAYILAN.siparisler.filter(function(x){ return x.id===o.id; })[0];
    tamamla(o, esle);
  });
}
function kaydet(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ============ yardımcılar ============ */
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(ad,sinif){ return '<svg class="ic'+(sinif?' '+sinif:'')+'"><use href="#i-'+ad+'"/></svg>'; }
function para(n){ return n.toLocaleString('tr-TR')+' ₺'; }
function bas(n){ return String(n).trim().charAt(0).toUpperCase(); }

var toastZ=null;
function toast(mesaj){
  var t=$('#toast'); t.textContent=mesaj; t.classList.add('on');
  clearTimeout(toastZ); toastZ=setTimeout(function(){ t.classList.remove('on'); },2100);
}

/* ============ üst çubuk ============ */
function ustCiz(){
  var on=S.online;
  $('#top').innerHTML=
    '<div class="toprow">'+
      '<div class="brandline">'+
        '<div class="logo">'+ic('bike')+'</div>'+
        '<div style="min-width:0">'+
          '<h1>Sezar Abi Kurye</h1>'+
          
        '</div>'+
      '</div>'+
      '<button class="pill '+(on?'on':'off')+'" id="onlineBtn" type="button" aria-pressed="'+on+'">'+
        '<span class="dot"></span>'+(on?'Açık':'Kapalı')+
      '</button>'+
    '</div>';
  $('#onlineBtn').addEventListener('click',function(){
    S.online=!S.online; kaydet();
    if(!S.online) toast('Çevrimdışısın — yeni sipariş gelmez');
    else toast('Çevrimiçi oldun');
    ustCiz(); durumCiz(); if(S.sekme==='home') gorunumCiz();
  });
}

/* ============ durum şeridi ============ */
function durumCiz(){
  /* Durum şeridi kaldırıldı: aynı bilgi üst çubuktaki rozette ve
     bölüm başlığındaki sayıda var. Tekrar eden yazı kalabalık yapar. */
  var el=$('#statusbar'); if(el) el.innerHTML='';
}

/* ============ alt menü ============ */
var SEKMELER=[
  {k:'home', ad:'Anasayfa', ik:'home'},
  {k:'kazanc', ad:'Kazanç', ik:'wallet'},
  {k:'mesaj', ad:'Mesajlar', ik:'msg'},
  {k:'profil', ad:'Profil', ik:'user'},
  {k:'yardim', ad:'Yardım', ik:'help'}
];
function navCiz(){
  $('#nav').innerHTML=SEKMELER.map(function(s){
    return '<button class="navb'+(S.sekme===s.k?' on':'')+'" data-sekme="'+s.k+'" type="button">'+
      ic(s.ik)+'<span>'+s.ad+'</span></button>';
  }).join('');
  Array.prototype.forEach.call($('#nav').querySelectorAll('[data-sekme]'),function(b){
    b.addEventListener('click',function(){ git(b.dataset.sekme); });
  });
}
function git(k){
  if(S.sekme===k && k!=='home'){ $('#view').scrollTop=0; return; }
  S.sekme=k; kaydet(); navCiz(); gorunumCiz(); $('#view').scrollTop=0;
}

/* ============ gerçek cihaz işlevleri ============ */

/* Titreşim: dokunma geri bildirimi. Desteklenmiyorsa sessizce geçer. */
function titres(desen){ try{ if(navigator.vibrate) navigator.vibrate(desen||12); }catch(e){} }

/* Uygulama APK içinde mi çalışıyor? Android köprüsü bunu işaretler. */
function apkMi(){ return !!(window.SEZAR_APP_MODE && window.SEZAR_APP); }

/* Dış adresi aç: APK'da native köprü, tarayıcıda yeni sekme.
   window.open popup engeline takılabildiği için gerçek bağlantı öğesi
   kullanılır; bu yol kullanıcı dokunuşuyla her zaman çalışır. */
function disariAc(url){
  if(apkMi()){ try{ window.SEZAR_APP.open(url); return; }catch(e){} }
  var a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); },0);
}

/* Google Maps navigasyonu — gerçek yol tarifi. */
function navigasyonBaslat(hedef, ad){
  if(!hedef || hedef.length<2){ toast('Adres koordinatı yok'); return; }
  var lat=hedef[0], lng=hedef[1];
  var url='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+
          '&travelmode=driving&dir_action=navigate';
  titres([14,40,14]);
  disariAc(url);
  toast('Navigasyon açılıyor: '+(ad||'varış'));
}

/* Haritada göster (yol tarifi değil, sadece konum). */
function haritadaGoster(konum, ad){
  if(!konum || konum.length<2){ toast('Koordinat yok'); return; }
  var url='https://www.google.com/maps/search/?api=1&query='+konum[0]+','+konum[1];
  titres(12); disariAc(url);
}

/* Telefon: gerçek arama ekranı. */
function ara(tel){
  if(!tel){ toast('Telefon numarası yok'); return; }
  var temiz=String(tel).replace(/[^\d+]/g,'');
  titres([10,30,10]);
  location.href='tel:'+temiz;
  toast('Aranıyor: '+temiz);
}

/* WhatsApp: müşteriye yaz. */
function whatsapp(tel, metin){
  if(!tel){ toast('Numara yok'); return; }
  var temiz=String(tel).replace(/[^\d]/g,'');
  var url='https://wa.me/'+temiz+(metin?'?text='+encodeURIComponent(metin):'');
  titres(12); disariAc(url);
}

/* Paylaş: native paylaşım sayfası (Android/Chrome), yoksa kopyala. */
function paylas(baslik, metin, url){
  var veri={title:baslik||'Sezar Abi Kurye', text:metin||'', url:url||location.href};
  if(navigator.share){
    navigator.share(veri).catch(function(){});
    return;
  }
  kopyala((metin?metin+'\n':'')+veri.url,'Bağlantı kopyalandı');
}

/* Panoya kopyala: eski tarayıcılar için yedek yol var. */
function kopyala(metin, mesaj){
  function tamam(){ toast(mesaj||'Kopyalandı'); titres(12); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(metin).then(tamam).catch(function(){ eskiKopyala(metin,tamam); });
  } else eskiKopyala(metin,tamam);
}
function eskiKopyala(metin,tamam){
  var t=document.createElement('textarea');
  t.value=metin; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); tamam(); }
  catch(e){ toast('Kopyalanamadı'); }
  document.body.removeChild(t);
}

/* Sipariş özetini paylaşılabilir metne çevir. */
function siparisMetni(o){
  return 'Sezar Abi Kurye · Görev\n'+
    o.isletme+'\n'+o.adres+'\nMüşteri: '+o.musteri+'\n'+
    String(o.km).replace('.',',')+' km · '+o.sure+' dk · '+o.ucret+' ₺';
}

/* ---------- bildirim ---------- */
function bildirimIzni(){
  if(!('Notification' in window)) return 'yok';
  return Notification.permission;
}
function bildirimIste(){
  if(!('Notification' in window)){ toast('Bu cihaz bildirimi desteklemiyor'); return; }
  if(Notification.permission==='granted'){ toast('Bildirimler zaten açık'); return; }
  Notification.requestPermission().then(function(p){
    S.bildirim=p==='granted'; kaydet();
    toast(p==='granted'?'Bildirimler açıldı':'Bildirim izni verilmedi');
    gorunumCiz();
  });
}
function bildir(baslik, govde){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification(baslik,{body:govde, icon:'icons/icon-192.png', tag:'sezar-gorev'}); }catch(e){}
}

/* ---------- kurulum (ana ekrana ekle) ---------- */
var kurulumOlayi=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); kurulumOlayi=e;
  var b=$('#kurBtn'); if(b) b.style.display='flex';
});
window.addEventListener('appinstalled',function(){
  kurulumOlayi=null; toast('Uygulama yüklendi'); titres([16,50,16]);
});
function kur(){
  if(apkMi()){ toast('Uygulama zaten kurulu'); return; }
  if(!kurulumOlayi){
    toast('Tarayıcı menüsünden "Ana ekrana ekle" seç');
    return;
  }
  kurulumOlayi.prompt();
  kurulumOlayi.userChoice.then(function(c){
    if(c.outcome==='accepted'){ toast('Yükleniyor…'); titres([16,50,16]); }
    kurulumOlayi=null;
  });
}

/* ---------- sürüm / güncelleme ---------- */
/* "1.10" ile "1.9" metin olarak yanlış sıralanır; parça parça sayı
   karşılaştır. a>b ise 1, a<b ise -1, eşitse 0. */
function surumKarsilastir(a,b){
  var pa=String(a||'').split('.'), pb=String(b||'').split('.');
  for(var i=0;i<Math.max(pa.length,pb.length);i++){
    var x=parseInt(pa[i],10)||0, y=parseInt(pb[i],10)||0;
    if(x>y) return 1;
    if(x<y) return -1;
  }
  return 0;
}
/* APK adresi: site kendi sunucusunda APK barındırıyorsa (apkWeb) onu
   kullan — GitHub indirme sunucusu bazı ağlarda engelli. */
function apkAdresi(v){
  var y=(v&&v.apkWeb)||'';
  if(y){ try{ return new URL(y,location.href).href; }catch(e){ return y; } }
  return (v&&v.apk)||'';
}
function surumDenetle(sessiz){
  fetch('version.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok? r.json():null; })
    .then(function(v){
      if(!v) { if(!sessiz) toast('Sürüm bilgisi alınamadı'); return; }
      /* Web sürümü service worker ile kendini günceller; burada
         "güncelleme var" demek anlamsız. APK'da ise karşılaştırma
         yayındaki APK'nın sürümüne göre yapılır — web sürümü ileri
         olabilir ama indirilecek APK henüz derlenmemiş olabilir. */
      if(!apkMi()){ if(!sessiz) toast('Uygulama güncel · v'+SURUM); return; }
      var hedef=v.apkVersion||v.version;
      var yeni=surumKarsilastir(hedef,SURUM)>0;
      if(!yeni){ if(!sessiz) toast('Uygulama güncel · v'+SURUM); return; }
      /* Aynı sürüme daha önce güncelleme denendi ve sürüm değişmediyse
         indirilen APK eskidir. Tekrar önermek kullanıcıyı döngüye sokar. */
      var denenen=null;
      try{ denenen=localStorage.getItem('sezar.denenenSurum'); }catch(e){}
      if(denenen===String(hedef)){
        if(!sessiz){
          katmanAc(
            '<div class="shhead"><div><h3>Güncelleme tamamlanmadı</h3>'+
            '<p class="shsub">v'+esc(SURUM)+' → v'+esc(hedef)+'</p></div>'+
            '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
            '<p style="font-size:13.5px;color:var(--ink2);margin:10px 0 0">'+
            'v'+esc(hedef)+' indirildi ama uygulama hâlâ v'+esc(SURUM)+' görünüyor. '+
            'Kurulumu tamamladıktan sonra uygulamayı kapatıp yeniden aç.</p>'+
            '<div class="acts" style="padding:16px 0 0;grid-template-columns:1fr">'+
            '<button class="btn pri" type="button" data-act="guncelle" data-url="'+esc(apkAdresi(v))+'">'+
            ic('box')+'Yeniden indir</button></div>'
          );
        }
        return;
      }
      katmanAc(
        '<div class="shhead"><div><h3>Güncelleme var</h3>'+
        '<p class="shsub">v'+esc(SURUM)+' → v'+esc(hedef)+'</p></div>'+
        '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
        '<p style="font-size:13.5px;color:var(--ink2);margin:10px 0 0">'+esc(v.notes||'Yeni sürüm hazır.')+'</p>'+
        '<div class="acts" style="padding:16px 0 0;grid-template-columns:1fr">'+
        '<button class="btn pri" type="button" data-act="guncelle" data-url="'+esc(apkAdresi(v))+'">'+
        ic('box')+'Güncelle</button></div>'
      );
    })
    .catch(function(){ if(!sessiz) toast('Bağlantı yok'); });
}
function guncelle(url){
  if(!url){ toast('İndirme adresi yok'); return; }
  katmanKapat();
  /* Denemeyi kaydet: indirilen APK eskiyse bir sonraki denetimde
     kullanıcıya "tamamlanmadı" denir, sonsuz döngü olmaz. */
  try{
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.ok? r.json():null; })
      .then(function(v){ if(v&&v.version) localStorage.setItem('sezar.denenenSurum',String(v.version)); })
      .catch(function(){});
  }catch(e){}
  if(apkMi() && window.SEZAR_APP.install){
    try{ window.SEZAR_APP.install(url); toast('Güncelleme indiriliyor…'); return; }catch(e){}
  }
  disariAc(url);
  toast('İndirme başladı');
}

/* ---------- ağ durumu ---------- */
function agDurumu(){
  var cevrimdisi=!navigator.onLine;
  var el=$('#agSerit');
  if(!el) return;
  el.className='agserit'+(cevrimdisi?' on':'');
  el.textContent=cevrimdisi?'Çevrimdışısın — kayıtlı görevler görünüyor':'';
}
window.addEventListener('online',function(){ agDurumu(); toast('Bağlantı geri geldi'); });
window.addEventListener('offline',function(){ agDurumu(); toast('Bağlantı kesildi'); });

/* ---------- aşağı çekip yenile ---------- */
function yenileKur(){
  var v=$('#view'), bas=0, cekik=false, esik=64;
  v.addEventListener('touchstart',function(e){
    if(v.scrollTop<=0){ bas=e.touches[0].clientY; cekik=true; }
  },{passive:true});
  v.addEventListener('touchmove',function(e){
    if(!cekik) return;
    var d=e.touches[0].clientY-bas;
    if(d>0 && v.scrollTop<=0) v.style.transform='translateY('+Math.min(d*0.45,esik)+'px)';
  },{passive:true});
  v.addEventListener('touchend',function(e){
    if(!cekik) return;
    cekik=false;
    var d=(e.changedTouches[0].clientY-bas)*0.45;
    v.style.transform='';
    if(d>=esik){
      titres(14); toast('Yenileniyor…');
      setTimeout(function(){ gorunumCiz(); durumCiz(); toast('Güncel'); },420);
    }
  },{passive:true});
}

/* ============ rota şeridi ============ */
/* Sahte harita çizmiyoruz: kurye uygulamasında asıl bilgi sıralı
   duraklardır (işletme -> müşteri). Harita düğmesi gerçek uygulamayı açar. */
function rotaSeridi(a){

/* ============ görünüm yönlendirme ============ */
function gorunumCiz(){
  var v=$('#view');
  var html='';
  if(S.sekme==='home') html=anaSayfa();
  else if(S.sekme==='kazanc') html=kazancSayfasi();

/* ============ olay bağlama ============ */
function bagla(kok){
  Array.prototype.forEach.call(kok.querySelectorAll('[data-siparis]'),function(b){
    b.addEventListener('click',function(){ siparisKatman(b.dataset.siparis); });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-faqbtn]'),function(b){
    b.addEventListener('click',function(){
      var f=b.closest('.faq'); f.classList.toggle('open');
    });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-mesaj]'),function(b){
    b.addEventListener('click',function(){
      var m=S.mesajlar.filter(function(x){return x.id===b.dataset.mesaj;})[0];
      if(m){ m.okunmadi=false; kaydet(); sohbetKatmani(m.id); gorunumCiz(); }
    });
  });
  Array.prototype.forEach.call(kok.querySelectorAll('[data-act]'),function(b){
    b.addEventListener('click',function(){ eylem(b.dataset.act, b); });
  });
}
function eylem(ad, el){
  var a=S.aktifGorev;
  if(ad==='asama'){
    if(!a) return;
    titres([12,30,12]);
    if(a.asama==='paket'){ a.asama='yolda'; toast('Paket alındı — müşteriye gidiyorsun');
      bildir('Paket alındı', a.isletme+' · '+a.adres); }
    else if(a.asama==='yolda'){ a.asama='teslim';
      S.kazanc.bugun+=a.ucret; S.kazanc.hafta+=a.ucret; S.kazanc.ay+=a.ucret; S.teslimat+=1;
      toast('Teslimat tamamlandı · +'+para(a.ucret));
      bildir('Teslimat tamam', a.musteri+' · +'+para(a.ucret)); }
    else { S.aktifGorev=null; toast('Görev tamamlandı, teşekkürler!'); }
    kaydet(); gorunumCiz(); durumCiz();
  }
  else if(ad==='navigasyon'){
    if(!a) return;
    var hedef=a.asama==='paket'? a.alis : a.varis;
    navigasyonBaslat(hedef, a.asama==='paket'? a.isletme : a.musteri);
  }
  else if(ad==='harita'){
    if(!a) return;
    haritadaGoster(a.asama==='paket'? a.alis : a.varis, a.isletme);
  }
  else if(ad==='kopyalaAdres'){
    if(!a) return;
    kopyala(a.adres, 'Adres kopyalandı');
  }
  else if(ad==='musteriAra'){
    if(!a) return; ara(a.musteriTel);
  }
  else if(ad==='musteriYaz'){
    if(!a) return;
    whatsapp(a.musteriTel, 'Merhaba '+a.musteri+', Sezar Abi Kurye\'den geliyorum. Yoldayım.');
  }
  else if(ad==='gorevAra'){
    if(!a) return; ara(a.tel);
  }
  else if(ad==='paylasGorev'){
    if(!a) return;
    paylas('Sezar Abi Kurye · Görev', siparisMetni(a));
  }
  else if(ad==='bildir'){
    if(!a) return;
    if(bildirimIzni()!=='granted'){ bildirimIste(); return; }
    bildir('Görev hatırlatması', a.isletme+' · '+a.sure+' dakika kaldı');
    toast('Hatırlatma gönderildi');
  }
  else if(ad==='guncelle'){ guncelle(el && el.dataset ? el.dataset.url : null); }
  else if(ad==='kopyalaSiparis'){
    var ks=siparisBul(el); if(!ks) return; kopyala(ks.adres,'Adres kopyalandı');
  }
  else if(ad==='siparisHarita'){
    var kh=siparisBul(el); if(!kh) return; haritadaGoster(kh.alis, kh.isletme);
  }
  else if(ad==='isletmeAra'){
    var ki=siparisBul(el); if(!ki) return; ara(ki.tel);
  }
  else if(ad==='paylasSiparis'){
    var kp=siparisBul(el); if(!kp) return;
    paylas('Sezar Abi Kurye · Sipariş', siparisMetni(kp));
  }
  else if(ad==='bitir'){
    S.aktifGorev=null; kaydet(); toast('Görev bırakıldı'); gorunumCiz(); durumCiz();
  }
  else if(ad==='kur'){ kur(); }
  else if(ad==='surum'){ surumDenetle(false); }
  else if(ad==='paylas'){ paylas('Sezar Abi Kurye','Kurye görev uygulaması'); }
  else if(ad==='bilgi'){ kisiselBilgiKatmani(); }
  else if(ad==='belge'){ belgeKatmani(); }
  else if(ad==='bildirim'){ bildirimIste(); }
  else if(ad==='hesap'){ odemeKatmani(); }
  else if(ad==='destek'){
    whatsapp('+905321112200','Merhaba, Sezar Abi Kurye destek.');
  }
  else if(ad==='ara'){ ara('08500000000'); }
  else if(ad==='cikis'){ cikisKatmani(); }
  else if(ad==='cikisOnay'){ cikisOnay(); }
}

/* Katman içindeki düğmenin siparişini bul. */
function siparisBul(el){
  var id=el && el.dataset ? el.dataset.id : null;
  if(!id) return null;
  return S.siparisler.filter(function(x){return x.id===id;})[0]||null;
}

/* ============ sohbet katmanı ============ */
/* Mesajlaşma demo veriyle çalışır; gönderilen metin cihazda saklanır.
   Gerçek sunucu bağlanınca yalnızca gonder() gövdesi değişir. */
function sohbetKatmani(id){
  var m=S.mesajlar.filter(function(x){return x.id===id;})[0];
  if(!m) return;
  m.gecmis=m.gecmis||[{kim:'onlar', metin:m.son, saat:m.saat}];
  katmanAc(
    '<div class="shhead"><div><h3>'+esc(m.kim)+'</h3>'+
      '<p class="shsub">Görevle ilgili mesajlar</p></div>'+
      '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
    '<div class="sohbet" id="sohbet">'+m.gecmis.map(function(x){
      return '<div class="balon '+(x.kim==='ben'?'ben':'onlar')+'">'+esc(x.metin)+
        '<span class="bsaat">'+esc(x.saat||'')+'</span></div>';
    }).join('')+'</div>'+
    '<div class="yazalim">'+
      '<input id="yazMetin" type="text" placeholder="Mesaj yaz…" autocomplete="off">'+
      '<button class="gonder" type="button" id="yazGonder" aria-label="Gönder">'+ic('nav')+'</button>'+
    '</div>'
  );
  var girdi=$('#yazMetin'), dugme=$('#yazGonder');
  function gonder(){
    var t=(girdi.value||'').trim();
    if(!t) return;
    var saat=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    m.gecmis.push({kim:'ben', metin:t, saat:saat});
    m.son=t; m.saat=saat; m.okunmadi=false;
    kaydet(); girdi.value='';
    var k=$('#sohbet');
    var b=document.createElement('div');
    b.className='balon ben';
    b.textContent=t;
    var s=document.createElement('span'); s.className='bsaat'; s.textContent=saat;
    b.appendChild(s); k.appendChild(b);
    k.scrollTop=k.scrollHeight;
    titres(10);
    /* Sunucu bağlanana kadar karşı taraf otomatik yanıtlar. */
    setTimeout(function(){
      var y='Tamamdır, teşekkürler 👍';
      m.gecmis.push({kim:'onlar', metin:y, saat:saat}); kaydet();
      var yb=document.createElement('div');
      yb.className='balon onlar'; yb.textContent=y;
      var ys=document.createElement('span'); ys.className='bsaat'; ys.textContent=saat;
      yb.appendChild(ys); k.appendChild(yb); k.scrollTop=k.scrollHeight;
      titres(8);
    },1400);
  }
  dugme.addEventListener('click',gonder);
  girdi.addEventListener('keydown',function(e){ if(e.key==='Enter') gonder(); });
  setTimeout(function(){ girdi.focus(); },260);
}

/* ============ sipariş katmanı ============ */
function katmanAc(html){
  var sh=$('#sheet');
  $('#sheetPanel').innerHTML='<div class="grab"></div>'+html;
  sh.classList.add('on');
  requestAnimationFrame(function(){ sh.classList.add('in'); });
  var kapat=$('#sheetPanel').querySelector('[data-close]');
  if(kapat) kapat.addEventListener('click',katmanKapat);
  var scrim=sh.querySelector('.scrim');
  scrim.onclick=katmanKapat;
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-al]'),function(b){
    b.addEventListener('click',function(){ gorevAl(b.dataset.al); });
  });
  /* Katman içindeki eylem düğmeleri de bağlanmalı; yoksa ölü kalır. */
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-close]:not([data-act])'),function(b){
    b.addEventListener('click',katmanKapat);
  });
  Array.prototype.forEach.call($('#sheetPanel').querySelectorAll('[data-act]'),function(b){
    b.addEventListener('click',function(){ eylem(b.dataset.act, b); });
  });
}
function katmanKapat(){
  var sh=$('#sheet');
  sh.classList.remove('in');
  setTimeout(function(){ sh.classList.remove('on'); },240);
}
function siparisKatman(id){
  var o=S.siparisler.filter(function(x){return x.id===id;})[0];
  if(!o) return;
  katmanAc(
    '<div class="shhead"><div><h3>'+esc(o.isletme)+'</h3>'+
      '<p class="shsub">'+esc(String(o.km).replace('.',','))+' km · '+esc(o.sure)+' dakika · '+para(o.ucret)+'</p></div>'+
      '<button class="shclose" type="button" data-close>'+ic('close')+'</button></div>'+
    '<div class="det" style="padding:12px 0 0">'+
      '<div class="row"><div class="rowic">'+ic('pin')+'</div><div class="rowbody">'+
        '<div class="rowk">Alış adresi</div><div class="rowv">'+esc(o.adres)+'</div></div>'+
        '<button class="rowbtn" type="button" data-act="kopyalaSiparis" data-id="'+esc(o.id)+'" title="Adresi kopyala">'+ic('doc')+'</button></div>'+
      '<div class="row"><div class="rowic">'+ic('user')+'</div><div class="rowbody">'+
        '<div class="rowk">Müşteri</div><div class="rowv">'+esc(o.musteri)+'</div></div>'+
        '<button class="rowbtn" type="button" data-act="siparisHarita" data-id="'+esc(o.id)+'" title="Haritada gör">'+ic('map')+'</button></div>'+
      '<div class="row"><div class="rowic">'+ic('clock')+'</div><div class="rowbody">'+
        '<div class="rowk">Tahmini süre</div><div class="rowv"><span class="eta">'+ic('clock')+esc(o.sure)+' dakika</span></div></div></div>'+
    '</div>'+
    '<div class="acts" style="padding:16px 0 8px;grid-template-columns:1fr">'+
      '<button class="btn pri" type="button" data-al="'+esc(o.id)+'">'+ic('box')+'Görevi Al</button>'+
    '</div>'+
    '<div class="quickrow" style="padding:0 0 4px">'+
      '<button class="qbtn" type="button" data-act="paylasSiparis" data-id="'+esc(o.id)+'">'+ic('share')+'<span>Paylaş</span></button>'+
      '<button class="qbtn" type="button" data-act="isletmeAra" data-id="'+esc(o.id)+'">'+ic('phone')+'<span>İşletme</span></button>'+
      '<button class="qbtn" type="button" data-act="siparisHarita" data-id="'+esc(o.id)+'">'+ic('map')+'<span>Harita</span></button>'+
      '<button class="qbtn" type="button" data-close>'+ic('close')+'<span>Kapat</span></button>'+
    '</div>'
  );
}
function gorevAl(id){
  var o=S.siparisler.filter(function(x){return x.id===id;})[0];
  if(!o) return;
  S.siparisler=S.siparisler.filter(function(x){return x.id!==id;});
  /* Sipariş nesnesi olduğu gibi kopyalanır: alan alan kurmak yeni
     eklenen alanları (koordinat, telefon) düşürüyordu. */
  S.aktifGorev=JSON.parse(JSON.stringify(o));
  S.aktifGorev.asama='paket';
  kaydet(); katmanKapat();
  S.sekme='home'; navCiz(); gorunumCiz(); durumCiz();
  toast('Görev alındı: '+o.isletme);
}

/* ============ başlat ============ */
/* Kısayol derin bağlantısı: ?git=<sekme> */
(function derinBaglanti(){
  var m=/[?&]git=([a-z]+)/i.exec(location.search);
  if(!m) return;
  var k=m[1].toLowerCase();
  var gecerli=SEKMELER.some(function(s){ return s.k===k; });
  if(gecerli) S.sekme=k;
})();

ustCiz(); navCiz(); gorunumCiz(); durumCiz(); agDurumu(); yenileKur();

/* Çevrimdışı destek: servis çalışanını kaydet. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  /* Yeni sürüm devreye girince bir kez yenile; yoksa kullanıcı eski
     sürümde takılı kalır. Sonsuz döngüyü bayrakla engelle. */
  var yenilendi=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(yenilendi) return;
    yenilendi=true;
    location.reload();
  });
}

/* Geri tuşu / Android geri: katman açıksa kapat. */
window.addEventListener('keydown',function(e){
  if(e.key==='Escape') katmanKapat();
});
history.pushState({katman:false},'');
window.addEventListener('popstate',function(){
  var sh=$('#sheet');
  if(sh && sh.classList.contains('on')){
    katmanKapat();
    history.pushState({katman:false},'');
  }
});

/* Sürüm denetimi: açılışta sessiz, günde bir kez. */
try{
  var sonDeneme=Number(localStorage.getItem('sezar.surumDeneme')||0);
  if(Date.now()-sonDeneme > 86400000){
    localStorage.setItem('sezar.surumDeneme',String(Date.now()));
    setTimeout(function(){ surumDenetle(true); },2500);
  }
}catch(e){}

})();
